name: Publish verified ParentPilot Preview 7

# One-time release of the already-built, green GitHub Actions preview artifacts.
# Intentionally tied to this filename and branch to avoid publishing old builds
# automatically each time somebody pushes a change.
on:
  push:
    branches:
      - feature/preview3-setup-screen-consent
    paths:
      - .github/workflows/publish-verified-preview7.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and validate successful source build runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 39293970843 39293955192; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')"
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status')"
            if [ "$state" != "completed" ] || [ "$result" != "success" ]; then
              echo "::error::Source GitHub Actions run $run is not successful."
              exit 1
            fi
          done
      - name: Download verified Linux and Android CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/linux output/android
          gh run download 39293970843 --repo "$GITHUB_REPOSITORY" --name ParentPilot-Debian-XFCE-DEB-v0.5.0-preview6 --dir output/linux
          gh run download 39293955192 --repo "$GITHUB_REPOSITORY" --name ParentPilot-Android-Updater-Debug-APK --dir output/android
          test -s 'output/linux/parentpilot_0.5.0~preview7_all.deb'
          test -s output/android/app-debug.apk
      - name: Verify package identity and version
        run: |
          set -euo pipefail
          deb='output/linux/parentpilot_0.5.0~preview7_all.deb'
          test "$(dpkg-deb -f "$deb" Package)" = parentpilot
          test "$(dpkg-deb -f "$deb" Version)" = '0.5.0~preview7'
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          dpkg-deb -c "$deb" | grep -F '/usr/bin/parentpilot-updates'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/update_install.py'
          command -v unzip
          unzip -t output/android/app-debug.apk | tail -n 2
      - name: Verify Android package name and update version
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/android/app-debug.apk |
            grep -E "package: name='uk.familycontrol.remote' versionCode='7'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify output/android/app-debug.apk
      - name: Prepare clearly labelled preview release
        run: |
          set -euo pipefail
          mkdir -p publish
          cp 'output/linux/parentpilot_0.5.0~preview7_all.deb' publish/
          cp output/android/app-debug.apk publish/ParentPilot-Android-v7-DEBUG.apk
          (cd publish && sha256sum *.deb *.apk > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          ## ParentPilot Preview 7 — family test build

          **This is a development preview, not a stable child-safety release.**

          **Linux:** Install parentpilot_0.5.0~preview7_all.deb on a fresh Linux Mint XFCE/X11 laptop. The adult Family Setup wizard creates a separate non-administrator child account, custom panel with Chromium, YouTube Kids/supervised YouTube, optional Netflix and Files, and the parent-controlled timer. Select filtering during setup if wanted. The new ParentPilot Updates utility is in the adult applications menu and checks official GitHub Releases. Existing configurations, PINs, and screen pictures are never intentionally reset by its update process. It makes a backup first, requires administrative approval and the child to be logged out. The updater is unverified on physical deployments and blocks unmarked legacy installs.

          **Android:** ParentPilot-Android-v7-DEBUG.apk is the latest native dashboard test APK: timer controls, pause/resume, screenshots, saved gallery and an update checker in Settings. It retains the uk.familycontrol.remote package ID. However **GitHub Actions debug signing is NOT persistent**, so this APK may NOT install over previous Android builds. It is labelled DEBUG and is intentionally not offered as a normal in-app upgrade. A permanent release signing key still needs to be configured for future normal in-place updates.

          The updated checks detect published signed stable assets only for Android. Preview Releases must be selected explicitly in the Linux adult update utility. **No child laptop was updated or wiped by publishing this release.**

          Included SHA256SUMS.txt allows independent verification.
          EOF
      - name: Publish prerelease in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0-preview7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The preview release tag already exists. Not overwriting binaries."
            exit 1
          fi
          gh release create v0.5.0-preview7 \
            publish/*.deb publish/*.apk publish/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ParentPilot Preview 7 — Linux + Android" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            --prerelease
          gh release view v0.5.0-preview7 --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets --jq '{url: .url, prerelease: .isPrerelease, assets: [.assets[].name]}'

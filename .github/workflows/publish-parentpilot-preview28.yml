name: Publish ParentPilot Linux Preview 28
# Publishes only the verified Preview 28 build artifact.

on:
  push:
    branches: [feature/preview3-setup-screen-consent]
    paths: ['.github/workflows/publish-parentpilot-preview28.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful verified source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run=39446477401
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .status)" = completed
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .conclusion)" = success
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .head_sha)" = 198f294ede3dc3b84ed98963f34aeb5c3487aa84
      - name: Download tested Debian package and check Whisker dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming publish
          gh run download 39446477401 --repo "$GITHUB_REPOSITORY" \
            --name ParentPilot-Debian-XFCE-DEB-v0.5.0-preview28 --dir incoming
          deb='incoming/parentpilot_0.5.0~preview28_all.deb'
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = parentpilot
          test "$(dpkg-deb -f "$deb" Version)" = '0.5.0~preview28'
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          dpkg-deb -f "$deb" Depends | grep -F 'xfce4-whiskermenu-plugin'
          dpkg-deb -f "$deb" Depends | grep -F 'xfce4-power-manager-plugins'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/screen_settings.py'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/account_settings.py'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/control_centre.py'
          dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-control-centre.desktop'
          ! dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-games.desktop'
          ! dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-updates.desktop'
          ! dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-screen-settings.desktop'
          dpkg-deb -f "$deb" Depends | grep -F 'vlc'
          ! dpkg-deb -f "$deb" Depends | grep -E '(^|, )kodi(,|$)'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/kodi_flatpak_test.py'
          dpkg-deb -c "$deb" > "$RUNNER_TEMP/package-files.txt"
          for file in \
            /usr/lib/parentpilot/child_panel.py \
            /usr/lib/parentpilot/update_install.py \
            /usr/lib/parentpilot/games_gui.py \
            /usr/lib/parentpilot/desktop/max_desktop.py
          do
            grep -F "$file" "$RUNNER_TEMP/package-files.txt" > /dev/null
          done
          cp "$deb" publish/parentpilot_0.5.0.preview28_all.deb
          (cd publish && sha256sum *.deb > SHA256SUMS.txt)
      - name: Prepare release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## ParentPilot Preview 28 — classic Kodi recommendation and optional test removal

          For older laptops such as the Dell Inspiron N5110, if **Kodi 20.5 APT plays local films more smoothly**, keep using it. Newer Kodi is still available, but is marked **OPTIONAL NEW KODI — FOR NEWER COMPUTERS** in **ParentPilot Control Centre → Games & Media**.

          - Keeps the newer official Flathub stable Kodi installer as an opt-in test, unchanged and clearly described as best suited to newer, more capable PCs.
          - Adds **Remove newer Kodi test** in Games & Media. After adult administrator confirmation, it uninstalls **only system-wide Flatpak `tv.kodi.Kodi`**, using fixed arguments and supported Flatpak options.
          - Cleans up the ParentPilot-generated **Kodi (New Version Test)** shortcut, if that launcher exactly matches the project’s known managed entry. An unrelated/modified launcher is left untouched.
          - If newer Kodi was already uninstalled by Terminal, pressing Remove simply cleans its old test shortcut; no redundant uninstall or APT operation is run.
          - **Does not remove** classic APT Kodi, its `~/.kodi` media library, pinned taskbar icon, any ParentPilot settings, accounts, PINs, screen-time allowances or saved screenshots.
          - Leaves Flatpak itself, shared runtimes, remotes, other Flatpak apps and the optional Kodi test profile intact. It never passes `--delete-data` or `--unused`.
          - After removal, the user can continue using classic Kodi as before, or reinstall the newer Kodi test later.

          **Install:** Adult account → ParentPilot Control Centre → Updates → preview → install Preview 28. To remove the newer Kodi, open Games & Media, scroll to the optional newer Kodi section and select **Remove newer Kodi test**. Confirm the action and approve the Linux administrator password.

          **To remove the newer Kodi immediately without updating first:** In an adult Terminal, run `sudo flatpak uninstall --system tv.kodi.Kodi`. This standard Flatpak command preserves settings and does not touch the APT Kodi package. Updating to Preview 28 can then tidy the standalone ParentPilot test shortcut.

          GitHub Actions passed backend install/removal tests, remote-origin safeguards, managed launcher preservation, compact GUI checks, legacy Kodi APT and game-install regressions, timer/lock checks and Debian package inspection. Physical Flatpak uninstall on the Dell remains to be confirmed.

          EOF
      - name: Publish verified preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0-preview28 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A previous run may have created the release before the heading
            # correction. Change metadata only: never overwrite tested assets.
            gh release edit v0.5.0-preview28 \
              --repo "$GITHUB_REPOSITORY" \
              --title "ParentPilot Linux Preview 28 - Classic Kodi guidance and safe Flatpak removal"
          else
            gh release create v0.5.0-preview28 \
              publish/parentpilot_0.5.0.preview28_all.deb publish/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target 198f294ede3dc3b84ed98963f34aeb5c3487aa84 \
              --title "ParentPilot Linux Preview 28 - Classic Kodi guidance and safe Flatpak removal" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease
          fi
          gh release view v0.5.0-preview28 --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets \
            --jq '{url:.url, prerelease:.isPrerelease, assets:[.assets[].name]}'

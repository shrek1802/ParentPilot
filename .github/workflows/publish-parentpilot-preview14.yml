name: Publish ParentPilot Linux Preview 14

on:
  push:
    branches: [feature/preview3-setup-screen-consent]
    paths: ['.github/workflows/publish-parentpilot-preview14.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify successful version-locked ParentPilot build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run=39322561374
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .status)" = completed
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .conclusion)" = success
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .head_sha)" = eb53de4c1ecdd5ac7af55f53e1a573ab2271b72b
      - name: Download and verify installable DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming publish
          gh run download 39322561374 --repo "$GITHUB_REPOSITORY" \
            --name ParentPilot-Debian-XFCE-DEB-v0.5.0-preview14 --dir incoming
          deb="incoming/parentpilot_0.5.0~preview14_all.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = parentpilot
          test "$(dpkg-deb -f "$deb" Version)" = "0.5.0~preview14"
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          dpkg-deb -f "$deb" Depends | grep -F 'vlc'
          dpkg-deb -c "$deb" > "$RUNNER_TEMP/package-files.txt"
          for file in \
            usr/lib/parentpilot/child_panel.py \
            usr/lib/parentpilot/setup-root \
            usr/lib/parentpilot/update_install.py \
            usr/lib/parentpilot/updates_gui.py \
            usr/lib/parentpilot/desktop/max_desktop.py
          do
            grep -F "$file" "$RUNNER_TEMP/package-files.txt" > /dev/null
          done
          cp "$deb" publish/parentpilot_0.5.0.preview14_all.deb
          (cd publish && sha256sum *.deb > SHA256SUMS.txt)
      - name: Prepare honest release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## ParentPilot Linux Preview 14 — normal child desktop restored

          **Correction to Preview 13.** The previous release mistakenly restricted the child's Linux applications menu to just a few shortcuts. This laptop is meant for learning to use a normal computer. Preview 14 restores the full XFCE applications menu.

          ### What changed
          - The regular Linux Mint/XFCE Applications menu is restored, showing normal installed programs, settings, Office, graphics, educational applications and utilities.
          - Reverses the exact autogenerated hidden entries that earlier ParentPilot versions wrongly put in the child's account for Terminal, software manager, application finder and administration utilities. Existing user-edited desktop launchers are not overwritten.
          - **VLC Media Player** is an explicit package dependency and has its own launcher. It plays local video and audio files normally, not through Chromium.
          - Only shortcuts to *alternative web browsers* are hidden in the child's visible menu. Chromium remains the default web browser. This is cosmetic; menu hiding is not security enforcement. Parent supervision and web filtering require separate settings.
          - The bottom panel includes the ParentPilot menu, running-window buttons, centred browser/Files/YouTube/optional Netflix/VLC shortcuts, status indicators and compact clock.
          - Removes the Preview 13 fixed-app-list menu and its duplicate generated Files/Logout entries.
          - Parent screen-time timer, lock screen, permissions, parent PIN, child account and saved screen pictures are preserved.
          - The adult-approved child sign-out and update workflow remains available.

          ### Updating Preview 13
          1. In the **adult administrator account**, open ParentPilot Updates.
          2. Select Preview and Check for updates. Review Preview 14 and approve installation. Save any open child work before agreeing to sign-out.
          3. After the update, sign the child into a fresh XFCE session. ParentPilot refreshes only the recognised child panel and launches the standard applications menu.
          4. Check that the menu shows **all installed apps, including VLC**, and that Chromium remains the intended browser.

          Automated source, upgrade/desktop and DEB build tests passed. The real Dell/XFCE interface still needs visual testing after the update.
          EOF
      - name: Publish new Preview 14 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0-preview14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Preview 14 already published; no overwrite permitted."
            exit 1
          fi
          gh release create v0.5.0-preview14 \
            publish/parentpilot_0.5.0.preview14_all.deb publish/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target eb53de4c1ecdd5ac7af55f53e1a573ab2271b72b \
            --title "ParentPilot Linux Preview 14 - restore the full applications menu and VLC" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          gh release view v0.5.0-preview14 --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets \
            --jq '{url:.url, prerelease:.isPrerelease, assets:[.assets[].name]}'

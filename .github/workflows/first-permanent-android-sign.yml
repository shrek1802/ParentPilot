name: ParentPilot permanent Android v7 signing verification

# One-time signing verification for first friend/family APK.
# Runs only when this workflow is first committed on the development branch.
on:
  push:
    branches: [feature/preview3-setup-screen-consent]
    paths:
      - '.github/workflows/first-permanent-android-sign.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permanently-signed-apk:
    if: github.repository == 'shrek1802/ParentPilot'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Verify all permanent signing credentials exist
        env:
          KEYSTORE_B64: ${{ secrets.PARENTPILOT_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PARENTPILOT_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.PARENTPILOT_ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] ||
             [ -z "$KEY_PASSWORD" ] || [ -z "$EXPECTED_CERT" ]; then
            echo "::error::One or more permanent Android signing secrets are not configured. Run the trusted-computer signing setup first."
            exit 1
          fi
          if ! [[ "$EXPECTED_CERT" =~ ^[a-fA-F0-9:]{64,95}$ ]]; then
            echo "::error::Permanent signing certificate fingerprint is invalid."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/parentpilot-release.jks"
          chmod 600 "$RUNNER_TEMP/parentpilot-release.jks"
          test -s "$RUNNER_TEMP/parentpilot-release.jks"
          echo "All permanent signing secrets were provided (values hidden)."
      - name: Build permanently signed Android APK
        env:
          PARENTPILOT_SIGNING_STORE_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_STORE_PASSWORD }}
          PARENTPILOT_SIGNING_KEY_ALIAS: ${{ secrets.PARENTPILOT_SIGNING_KEY_ALIAS }}
          PARENTPILOT_SIGNING_KEY_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PARENTPILOT_SIGNING_STORE="$RUNNER_TEMP/parentpilot-release.jks"
          gradle --no-daemon -p android-app :app:assembleRelease
          test -s android-app/app/build/outputs/apk/release/app-release.apk
      - name: Verify Android package and same permanent signing identity
        env:
          EXPECTED_CERT: ${{ secrets.PARENTPILOT_ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -E "package: name='uk.familycontrol.remote' versionCode='7'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" \
            > "$RUNNER_TEMP/apk-validation.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-validation.txt" | head -1)"
          got="$(printf %s "$actual" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          expected="$(printf %s "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [ -z "$got" ] || [ "$got" != "$expected" ]; then
            echo "::error::APK signing certificate does not match the permanent secret."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/ParentPilot-Android-v7-SIGNED.apk
          (cd dist && sha256sum ParentPilot-Android-v7-SIGNED.apk > SHA256SUMS.txt)
          echo "Verified ParentPilot app ID, version 7 and permanent signing certificate."
      - name: Upload verified permanently signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ParentPilot-Android-v7-PERMANENT-SIGNING-VERIFIED
          path: |
            dist/ParentPilot-Android-v7-SIGNED.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

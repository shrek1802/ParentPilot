name: Publish ParentPilot Linux Preview 12

on:
  push:
    branches: [feature/preview3-setup-screen-consent]
    paths:
      - '.github/workflows/publish-verified-preview12.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful exact Preview 12 CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=39318053064
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/actions/runs/$id" --jq .status)" = completed
          test "$(gh api "repos/$repo/actions/runs/$id" --jq .conclusion)" = success
          test "$(gh api "repos/$repo/actions/runs/$id" --jq .head_sha)" = "0093ca748215bbe60d93aeac35df54bde7f1e677"

      - name: Download and inspect verified Debian build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming published
          gh run download 39318053064 --repo "$GITHUB_REPOSITORY" \
            --name ParentPilot-Debian-XFCE-DEB-v0.5.0-preview12 --dir incoming
          deb='incoming/parentpilot_0.5.0~preview12_all.deb'
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = parentpilot
          test "$(dpkg-deb -f "$deb" Version)" = '0.5.0~preview12'
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/update_install.py'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/updates_gui.py'
          cp "$deb" published/parentpilot_0.5.0.preview12_all.deb
          (cd published && sha256sum *.deb > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## ParentPilot Linux Preview 12 — corrected child app icons

          **New in this Linux Mint XFCE/X11 preview**

          - Fixed the malformed Files/Thunar shortcut; it now has a valid desktop entry and a visible folder icon.
          - Browser, Files, YouTube and Netflix shortcuts now use icons bundled within the ParentPilot DEB, avoiding unreliable theme icon names.
          - The child panel repair refreshes the existing app shortcut icon references and launcher copies, preserving their browser commands and YouTube Kids/supervised selection.
          - The branded ParentPilot applications menu and centred launcher layout are refreshed on the child's next graphical login through XFCE's live settings service.
          - Existing child account, login password, six-digit parent PIN, timer settings and screenshots are preserved.
          - Retains Preview 11's adult-approved option to sign out the child before an update (with an explicit warning that unsaved child work will close).

          **Upgrade from Preview 10 or 11**
          1. Sign in as the adult administrator.
          2. Open ParentPilot Updates, select **Preview**, and check for updates.
          3. Save any work in the child session. Review the release notes, approve the update and permit child sign-out when prompted. Administrator authentication is required.
          4. Allow the update to finish and sign the child in again; this loads the corrected child icons and taskbar.
          5. Check the Browser, Files, YouTube Kids and optional Netflix shortcuts launch correctly, and that the notification area and clock remain visible.

          The parent-approved updater backs up settings and child panel XML before replacing managed files; it will not rerun initial setup or deliberately reset family settings. The child panel repair acts only on a recognised ParentPilot-managed panel.

          CI checks passed for launcher contents, correct icon paths, bundled SVG validity, service and package logic. Real Mint hardware display results still require your confirmation.

          The Android APK is unchanged; use the permanently signed Android v7 APK in the earlier Preview 8 release.
          EOF

      - name: Publish new Preview 12 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0-preview12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Preview 12 already exists. Refusing to overwrite."
            exit 1
          fi
          gh release create v0.5.0-preview12 \
            published/parentpilot_0.5.0.preview12_all.deb published/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 0093ca748215bbe60d93aeac35df54bde7f1e677 \
            --title "ParentPilot Linux Preview 12 - corrected launcher icons" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          gh release view v0.5.0-preview12 --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets \
            --jq '{url: .url, prerelease: .isPrerelease, assets: [.assets[].name]}'

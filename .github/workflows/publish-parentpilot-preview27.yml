name: Publish ParentPilot Linux Preview 27

on:
  push:
    branches: [feature/preview3-setup-screen-consent]
    paths: ['.github/workflows/publish-parentpilot-preview27.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful verified source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run=39442954284
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .status)" = completed
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .conclusion)" = success
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .head_sha)" = 4773ed8cb54ae9012adeffdded20524a77a73cc0
      - name: Download tested Debian package and check Whisker dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming publish
          gh run download 39442954284 --repo "$GITHUB_REPOSITORY" \
            --name ParentPilot-Debian-XFCE-DEB-v0.5.0-preview27 --dir incoming
          deb='incoming/parentpilot_0.5.0~preview27_all.deb'
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = parentpilot
          test "$(dpkg-deb -f "$deb" Version)" = '0.5.0~preview27'
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          dpkg-deb -f "$deb" Depends | grep -F 'xfce4-whiskermenu-plugin'
          dpkg-deb -f "$deb" Depends | grep -F 'xfce4-power-manager-plugins'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/screen_settings.py'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/account_settings.py'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/control_centre.py'
          dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-control-centre.desktop'
          ! dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-games.desktop'
          ! dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-updates.desktop'
          ! dpkg-deb -c "$deb" | grep -F '/usr/share/applications/parentpilot-screen-settings.desktop'
          dpkg-deb -f "$deb" Depends | grep -F 'vlc'
          ! dpkg-deb -f "$deb" Depends | grep -E '(^|, )kodi(,|$)'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/kodi_flatpak_test.py'
          dpkg-deb -c "$deb" > "$RUNNER_TEMP/package-files.txt"
          for file in \
            /usr/lib/parentpilot/child_panel.py \
            /usr/lib/parentpilot/update_install.py \
            /usr/lib/parentpilot/games_gui.py \
            /usr/lib/parentpilot/desktop/max_desktop.py
          do
            grep -F "$file" "$RUNNER_TEMP/package-files.txt" > /dev/null
          done
          cp "$deb" publish/parentpilot_0.5.0.preview27_all.deb
          (cd publish && sha256sum *.deb > SHA256SUMS.txt)
      - name: Prepare release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## ParentPilot Preview 27 — fix Kodi Flatpak false installation failure

          Fixes a reproducible bug in Preview 26: **Kodi Flatpak test stopped: error: Unknown option --show-version**. The new Kodi Flatpak can already have been installed successfully, but ParentPilot incorrectly marked it as failed when the final verification command used a nonexistent Flatpak option.

          **What was fixed**
          - Uses documented and widely supported **flatpak info --system --show-ref tv.kodi.Kodi** to verify the system-wide stable Kodi app, and **--show-origin** to confirm its Flathub source.
          - Reads the optional human-readable Version field from **flatpak info --system tv.kodi.Kodi**. No unsupported --show-version command; lack of version text no longer causes a false failure.
          - **Before downloading**, detects an existing Kodi Flatpak left by Preview 26 and finishes immediately, restoring the distinct **Kodi (New Version Test)** launcher. No unnecessary redownload or reinstall.
          - Rejects unexpected app refs, origins or tampered Flathub remotes; keeps the parent approval requirement.
          - Leaves classic APT Kodi, its existing profiles under ~/.kodi, taskbar pins, child accounts, ParentPilot PIN and time allowances untouched.

          **How to use on the Dell:** From the adult account, update ParentPilot Control Centre → Updates to Preview 27. Then open Games & Media, scroll to **New Kodi — Separate Test**, and press **Install newer Kodi for testing**. If it was already installed, the installer will verify it and create the missing launcher without a second download. Switch to the child account and open **Applications → Multimedia → Kodi (New Version Test)** to check menus, video and sound.

          GitHub Actions passed tests covering already-installed Kodi recovery, missing version fields, secure Flathub source verification, expected install commands, old Kodi preservation, compact GUI screens, timer/lock regressions and Debian package validation. Actual playback on the Dell still needs testing.

          EOF
      - name: Publish verified preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0-preview27 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A previous run may have created the release before the heading
            # correction. Change metadata only: never overwrite tested assets.
            gh release edit v0.5.0-preview27 \
              --repo "$GITHUB_REPOSITORY" \
              --title "ParentPilot Linux Preview 27 - Kodi Flatpak verification fix"
          else
            gh release create v0.5.0-preview27 \
              publish/parentpilot_0.5.0.preview27_all.deb publish/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target 4773ed8cb54ae9012adeffdded20524a77a73cc0 \
              --title "ParentPilot Linux Preview 27 - Kodi Flatpak verification fix" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease
          fi
          gh release view v0.5.0-preview27 --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets \
            --jq '{url:.url, prerelease:.isPrerelease, assets:[.assets[].name]}'

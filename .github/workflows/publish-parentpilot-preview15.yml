name: Publish ParentPilot Linux Preview 15

on:
  push:
    branches: [feature/preview3-setup-screen-consent]
    paths:
      - '.github/workflows/publish-parentpilot-preview15.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm the exact CI-tested build is successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run=39324382467
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .status)" = completed
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .conclusion)" = success
          test "$(gh api "repos/$repo/actions/runs/$run" --jq .head_sha)" = 4794e33b66f1c4ae80e00708ff286602499fae06

      - name: Download and verify installable ParentPilot Preview 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming publish
          gh run download 39324382467 --repo "$GITHUB_REPOSITORY" \
            --name ParentPilot-Debian-XFCE-DEB-v0.5.0-preview15 \
            --dir incoming
          deb="incoming/parentpilot_0.5.0~preview15_all.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = parentpilot
          test "$(dpkg-deb -f "$deb" Version)" = "0.5.0~preview15"
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          dpkg-deb -c "$deb" > "$RUNNER_TEMP/package-files.txt"
          for name in \
            usr/lib/parentpilot/setup-root \
            usr/lib/parentpilot/child_panel.py \
            usr/lib/parentpilot/games_catalog.py \
            usr/lib/parentpilot/games_gui.py \
            usr/lib/parentpilot/games_install.py \
            usr/bin/parentpilot-games \
            usr/share/applications/parentpilot-games.desktop \
            usr/lib/parentpilot/update_install.py \
            usr/lib/parentpilot/desktop/max_desktop.py
          do
            grep -F "$name" "$RUNNER_TEMP/package-files.txt" > /dev/null
          done
          cp "$deb" publish/parentpilot_0.5.0.preview15_all.deb
          (cd publish && sha256sum *.deb > SHA256SUMS.txt)

      - name: Create release notes for fresh and existing families
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## ParentPilot Linux Preview 15 — optional free games

          Development preview for Linux Mint XFCE/X11. Tested in GitHub Actions, but the game selections still require testing on the actual laptop.

          ### Eight free games now available
          **Learning:** GCompris, Tux Maths, Tux Typing.
          **Creativity:** Tux Paint.
          **Logic and puzzles:** Pingus, Sudoku.
          **Fun 2D games:** SuperTux, Frozen Bubble.

          Packages: gcompris-qt, tuxmath, tuxtype, tuxpaint, pingus, gnome-sudoku, supertux, frozen-bubble.

          These are normal free software from Linux Mint's configured APT repositories. Older i3/6GB laptops are a reasonable target; GCompris can be a larger download and some games depend on installed graphics drivers.

          ### New installations
          - Individual **unchecked-by-default** tick boxes are on the Family Setup wizard's Parental controls & apps page.
          - The adult chooses exactly which games to install. Selected games download after the child account, timer and parental controls are provisioned.
          - Failed optional downloads do not reset the child account or invalidate a successful ParentPilot installation. They can be retried later.

          ### Existing ParentPilot laptops — no reinstall
          - Sign into the **adult administrator account**.
          - Open **ParentPilot Games & Learning** in Applications → Settings, tick any games and approve the administrator password popup.
          - The installer refuses unapproved game names or arbitrary commands, never removes existing software and does not touch family settings.
          - Games appear in the normal Linux Mint Applications menu and count toward the child's existing ParentPilot screen-time allowance.
          - Games are also installed system-wide as normal Linux programs; they are visible to the adult too.
          - Needs an internet connection and corresponding Ubuntu/Debian repository packages.

          ### Unchanged
          ParentPilot's separate child account, six-digit parent PIN, regular full XFCE applications menu, VLC player, supervised Chromium policy, lock screen, saved screenshots, Android remote app and parent-controlled updater all remain as before.

          As before, this is preview software; test on the real Dell laptop before relying on it for unattended child supervision.
          EOF

      - name: Publish verified Preview 15 without overwriting old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0-preview15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Preview 15 already published. Refusing to overwrite."
            exit 1
          fi
          gh release create v0.5.0-preview15 \
            publish/parentpilot_0.5.0.preview15_all.deb publish/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 4794e33b66f1c4ae80e00708ff286602499fae06 \
            --title "ParentPilot Linux Preview 15 - free educational and fun games" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease
          gh release view v0.5.0-preview15 --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets \
            --jq '{url:.url, prerelease:.isPrerelease, assets:[.assets[].name]}'

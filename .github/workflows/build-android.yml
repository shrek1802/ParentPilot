name: Build ParentPilot Android APK

on:
  push:
    branches: [main, feature/preview3-setup-screen-consent]
    paths:
      - 'android-app/**'
      - 'scripts/setup-android-signing.sh'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'scripts/setup-android-signing.sh'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check signing setup script syntax (without exposing keys)
        run: bash -n scripts/setup-android-signing.sh
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android APK for automated tests
        run: gradle --no-daemon --stacktrace -p android-app :app:assembleDebug
      - name: Verify unchanged app ID and version code
        run: |
          set -euo pipefail
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            android-app/app/build/outputs/apk/debug/app-debug.apk |
            grep -E "package: name='uk.familycontrol.remote' versionCode='7'"
          ! grep -E 'ACTION_VIEW|android.webkit.WebView' android-app/app/src/main/java/uk/familycontrol/remote/MainActivity.kt
      - name: Upload temporary debug APK (NOT suitable for updates)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ParentPilot-Debug-Testing-ONLY-NOT-UPDATABLE
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # A manual Run workflow builds ONLY the persistently signed APK for
      # friends and public release testing, using one fixed private certificate.
      - name: Load permanent release key for manual signed builds
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.PARENTPILOT_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PARENTPILOT_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.PARENTPILOT_ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] ||
             [ -z "$EXPECTED_CERT" ]; then
            echo "::error::Permanent Android signing secrets are not configured. Run scripts/setup-android-signing.sh on your trusted adult computer first."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/parentpilot-release.jks"
          chmod 600 "$RUNNER_TEMP/parentpilot-release.jks"
          test -s "$RUNNER_TEMP/parentpilot-release.jks"

      - name: Compile permanently signed release APK
        if: github.event_name == 'workflow_dispatch'
        env:
          PARENTPILOT_SIGNING_STORE_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_STORE_PASSWORD }}
          PARENTPILOT_SIGNING_KEY_ALIAS: ${{ secrets.PARENTPILOT_SIGNING_KEY_ALIAS }}
          PARENTPILOT_SIGNING_KEY_PASSWORD: ${{ secrets.PARENTPILOT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PARENTPILOT_SIGNING_STORE="$RUNNER_TEMP/parentpilot-release.jks"
          gradle --no-daemon --stacktrace -p android-app :app:assembleRelease
          test -s android-app/app/build/outputs/apk/release/app-release.apk

      - name: Verify APK package ID, version and permanent signing certificate
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_CERT: ${{ secrets.PARENTPILOT_ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="android-app/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -E "package: name='uk.familycontrol.remote' versionCode='7'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" \
            > "$RUNNER_TEMP/apk-signing-check.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signing-check.txt" | head -1)"
          got="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test -n "$got"
          if [ "$got" != "$expected" ]; then
            echo "::error::The APK signer does NOT match the permanent ParentPilot certificate. No signed APK will be uploaded."
            exit 1
          fi
          cp "$apk" dist/ParentPilot-Android-v7-SIGNED.apk
          (cd dist && sha256sum ParentPilot-Android-v7-SIGNED.apk > SHA256SUMS.txt)
          echo 'Verified same ParentPilot package ID, increasing version and permanent signing certificate.'

      - name: Upload verified permanently signed APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ParentPilot-Android-v7-PERMANENTLY-SIGNED
          path: |
            dist/ParentPilot-Android-v7-SIGNED.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60

name: Publish ParentPilot Linux Preview 11

on:
  push:
    branches: [feature/preview3-setup-screen-consent]
    paths:
      - '.github/workflows/publish-verified-preview11.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful exact Preview 11 CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=39309953271
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/actions/runs/$id" --jq .status)" = completed
          test "$(gh api "repos/$repo/actions/runs/$id" --jq .conclusion)" = success
          test "$(gh api "repos/$repo/actions/runs/$id" --jq .head_sha)" = "9c6148811772aaab1b675d996f50f00915af492f"

      - name: Download and inspect verified Debian build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming published
          gh run download 39309953271 --repo "$GITHUB_REPOSITORY" \
            --name ParentPilot-Debian-XFCE-DEB-v0.5.0-preview11 --dir incoming
          deb='incoming/parentpilot_0.5.0~preview11_all.deb'
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = parentpilot
          test "$(dpkg-deb -f "$deb" Version)" = '0.5.0~preview11'
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/update_install.py'
          dpkg-deb -c "$deb" | grep -F '/usr/lib/parentpilot/updates_gui.py'
          cp "$deb" published/parentpilot_0.5.0.preview11_all.deb
          (cd published && sha256sum *.deb > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## ParentPilot Linux Preview 11 — Parent-approved automatic child sign-out

          ParentPilot now offers to sign out a still-running child desktop when an adult installs an update, without manually entering loginctl commands.

          1. Use the adult administrator account and open ParentPilot Updates.
          2. Select Preview, check for updates, read the new release notes, and click Install update.
          3. Confirm the explicit warning: if the child account remains signed in, its open applications will close and any unsaved work may be lost. Save the child's work first.
          4. Authenticate using the existing adult administrator password when PolicyKit requests approval.
          5. ParentPilot validates the GitHub DEB and takes a private backup BEFORE signing the child out.
          6. The privileged updater signs out ONLY the configured non-admin child account, checks that XFCE has finished logging out, and installs the new DEB.
          7. Sign the child in when ready; the account, parent PIN, timer settings, Chromium shortcuts and saved gallery are preserved.

          **Protections:** no silent or child-initiated logouts; ambiguous session states stop the update; no forced SIGKILL; no other Linux account is targeted. The initial release preserves Preview 10's panel, lock UI and smaller-screen updater improvements.

          This is a testing preview. Code, package, CI and mocked-session tests passed; the exact logout flow still needs a trial on your Linux Mint hardware. Preview 10 remains available as a fallback.
          EOF

      - name: Publish new Preview 11 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0-preview11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Preview 11 already exists. Refusing to overwrite."
            exit 1
          fi
          gh release create v0.5.0-preview11 \
            published/parentpilot_0.5.0.preview11_all.deb published/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 9c6148811772aaab1b675d996f50f00915af492f \
            --title "ParentPilot Linux Preview 11 - easier parent updates" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          gh release view v0.5.0-preview11 --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets \
            --jq '{url: .url, prerelease: .isPrerelease, assets: [.assets[].name]}'

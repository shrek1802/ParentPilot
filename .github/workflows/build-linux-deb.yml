name: Build ParentPilot Debian-family DEB

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-deb.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Python and installer
        run: |
          python3 packaging/test_installer.py
          python3 packaging/test_compatibility.py
          python3 -m compileall -q desktop packaging/parentpilot
          bash -n packaging/build-deb.sh
      - name: Test parent timer and PIN API
        run: python3 test_server.py
        working-directory: desktop
      - name: Build Debian package
        run: bash packaging/build-deb.sh "$GITHUB_WORKSPACE/dist"
      - name: Inspect package and protect maintainer scripts
        run: |
          test -s dist/parentpilot_0.5.0~preview4_all.deb
          dpkg-deb --info dist/parentpilot_0.5.0~preview4_all.deb
          dpkg-deb --contents dist/parentpilot_0.5.0~preview4_all.deb | grep -F '/usr/lib/parentpilot/setup-root'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview4_all.deb | grep -F '/usr/share/applications/parentpilot-setup.desktop'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview4_all.deb | grep -F '/usr/share/icons/hicolor/128x128/apps/parentpilot.png'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview4_all.deb | grep -F '/usr/share/metainfo/uk.parentpilot.ParentPilot.metainfo.xml'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview4_all.deb | grep -F '/usr/lib/parentpilot/desktop/screen_view.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview4_all.deb | grep -F '/usr/lib/parentpilot/desktop/parentpilot_screen_parent.js'
      - name: Upload ParentPilot installable DEB
        uses: actions/upload-artifact@v4
        with:
          name: ParentPilot-Debian-XFCE-DEB-v0.5.0-preview4
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

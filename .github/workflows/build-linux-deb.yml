name: Build ParentPilot Debian-family DEB

on:
  push:
    branches: [main, feature/preview3-setup-screen-consent]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-deb.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tkinter for headless desktop regression
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-tk xvfb xauth

      - name: Check Python and installer
        run: |
          python3 packaging/test_installer.py
          python3 packaging/test_account_settings.py
          python3 packaging/test_screen_settings.py
          python3 packaging/test_games.py
          python3 packaging/test_kodi_flatpak.py
          python3 packaging/test_compatibility.py
          python3 packaging/test_updates.py
          python3 packaging/test_child_signout.py
          python3 -m compileall -q desktop packaging/parentpilot
          bash -n packaging/build-deb.sh
      - name: Test updater buttons fit smaller XFCE screens and high DPI
        run: |
          xvfb-run -a -s '-screen 0 1024x600x24' python3 packaging/test_updates_gui.py
          xvfb-run -a -s '-screen 0 800x480x24' python3 packaging/test_updates_gui.py
          xvfb-run -a -s '-screen 0 1024x600x24' python3 packaging/test_games_gui.py
          xvfb-run -a -s '-screen 0 800x480x24' python3 packaging/test_games_gui.py
          xvfb-run -a -s '-screen 0 1024x600x24' python3 packaging/test_wizard_gui.py
          xvfb-run -a -s '-screen 0 800x480x24' python3 packaging/test_wizard_gui.py
          xvfb-run -a -s '-screen 0 1024x600x24' python3 packaging/test_control_centre_gui.py
          xvfb-run -a -s '-screen 0 800x480x24' python3 packaging/test_control_centre_gui.py
          xvfb-run -a -s '-screen 0 1024x600x24' python3 packaging/test_android_download.py
          xvfb-run -a -s '-screen 0 800x480x24' python3 packaging/test_android_download.py
      - name: Confirm official Ubuntu Kodi package is present (no third-party sources)
        run: |
          apt-cache show kodi | grep -F 'Package: kodi'
      - name: Confirm native XFCE power manager plugin is available
        run: |
          apt-cache show xfce4-power-manager-plugins | grep -F 'Package: xfce4-power-manager-plugins'
      - name: Verify optional game packages in official Ubuntu APT listings
        run: |
          for package in kgeography blinken ktuberling supertuxkart extremetuxracer minetest hedgewars; do
            echo "Checking optional APT game: $package"
            apt-cache show "$package" | grep -m 1 -F "Package: $package"
          done
      - name: Test single supervisor per child session
        run: python3 desktop/test_supervisor_singleton.py

      - name: Test lock-screen stability and recovery
        run: python3 desktop/test_lock_stability.py

      - name: Test parent timer and PIN API
        run: python3 test_server.py
        working-directory: desktop
      - name: Build Debian package
        run: bash packaging/build-deb.sh "$GITHUB_WORKSPACE/dist"
      - name: Inspect package and protect maintainer scripts
        run: |
          test -s dist/parentpilot_0.5.0~preview30_all.deb
          dpkg-deb --info dist/parentpilot_0.5.0~preview30_all.deb
          dpkg-deb --field dist/parentpilot_0.5.0~preview30_all.deb Depends | grep -F 'xfce4-whiskermenu-plugin'
          dpkg-deb --field dist/parentpilot_0.5.0~preview30_all.deb Depends | grep -F 'xfce4-power-manager-plugins'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/setup-root'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/child_panel.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/games_catalog.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/games_gui.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/games_install.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/kodi_flatpak_test.py'
          ! dpkg-deb --field dist/parentpilot_0.5.0~preview30_all.deb Depends | grep -E '(^|, )flatpak(,|$)'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/icons/browser.svg'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/icons/files.svg'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/icons/youtube.svg'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/icons/netflix.svg'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/share/applications/parentpilot-setup.desktop'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/share/icons/hicolor/128x128/apps/parentpilot.png'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/share/metainfo/uk.parentpilot.ParentPilot.metainfo.xml'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/desktop/screen_view.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/desktop/parentpilot_screen_parent.js'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/bin/parentpilot-updates'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/update_install.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/account_settings.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/control_centre.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/android_download.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/share/applications/parentpilot-control-centre.desktop'
          ! dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/share/applications/parentpilot-games.desktop'
          ! dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/share/applications/parentpilot-updates.desktop'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/lib/parentpilot/screen_settings.py'
          ! dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/usr/share/applications/parentpilot-screen-settings.desktop'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview30_all.deb | grep -F '/etc/xdg/autostart/parentpilot-update-check.desktop'
          ! dpkg-deb --field dist/parentpilot_0.5.0~preview30_all.deb Depends | grep -E '(^|, )kodi(,|$)'
          dpkg-deb --field dist/parentpilot_0.5.0~preview30_all.deb Depends | grep -F 'vlc'
      - name: Upload ParentPilot installable DEB
        uses: actions/upload-artifact@v4
        with:
          name: ParentPilot-Debian-XFCE-DEB-v0.5.0-preview30
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

name: Build ParentPilot Debian-family DEB

on:
  push:
    branches: [main, feature/preview3-setup-screen-consent]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-deb.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tkinter for headless desktop regression
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-tk xvfb xauth

      - name: Check Python and installer
        run: |
          python3 packaging/test_installer.py
          python3 packaging/test_compatibility.py
          python3 packaging/test_updates.py
          python3 -m compileall -q desktop packaging/parentpilot
          bash -n packaging/build-deb.sh
      - name: Test updater buttons fit smaller XFCE screens and high DPI
        run: |
          xvfb-run -a -s '-screen 0 1024x600x24' python3 packaging/test_updates_gui.py
          xvfb-run -a -s '-screen 0 800x480x24' python3 packaging/test_updates_gui.py
      - name: Test single supervisor per child session
        run: python3 desktop/test_supervisor_singleton.py

      - name: Test lock-screen stability and recovery
        run: python3 desktop/test_lock_stability.py

      - name: Test parent timer and PIN API
        run: python3 test_server.py
        working-directory: desktop
      - name: Build Debian package
        run: bash packaging/build-deb.sh "$GITHUB_WORKSPACE/dist"
      - name: Inspect package and protect maintainer scripts
        run: |
          test -s dist/parentpilot_0.5.0~preview10_all.deb
          dpkg-deb --info dist/parentpilot_0.5.0~preview10_all.deb
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/lib/parentpilot/setup-root'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/lib/parentpilot/child_panel.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/share/applications/parentpilot-setup.desktop'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/share/icons/hicolor/128x128/apps/parentpilot.png'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/share/metainfo/uk.parentpilot.ParentPilot.metainfo.xml'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/lib/parentpilot/desktop/screen_view.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/lib/parentpilot/desktop/parentpilot_screen_parent.js'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/bin/parentpilot-updates'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/lib/parentpilot/update_install.py'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/usr/share/applications/parentpilot-updates.desktop'
          dpkg-deb --contents dist/parentpilot_0.5.0~preview10_all.deb | grep -F '/etc/xdg/autostart/parentpilot-update-check.desktop'
      - name: Upload ParentPilot installable DEB
        uses: actions/upload-artifact@v4
        with:
          name: ParentPilot-Debian-XFCE-DEB-v0.5.0-preview10
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
